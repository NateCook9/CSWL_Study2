<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSWL Experiment</title>
  <!-- jsPsych core and CSS -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  
  <!-- jsPsych Plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  
  <!-- PapaParse for CSV loading -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    .stim-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 700px;
      margin: 50px auto;
    }
    .stim-image {
      width: 220px;
      height: 220px;
      object-fit: contain;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
    .fixation-cross {
      font-size: 60px;
      font-weight: bold;
    }
    .key-hint {
      position: absolute;
      bottom: -30px;
      font-size: 16px;
      color: #555;
    }
    .img-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .instructions-card {
      max-width: 650px;
      margin: 0 auto;
      text-align: left;
      line-height: 1.6;
      font-size: 18px;
    }
    .btn-continue {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 25px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
    }
    .btn-continue:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
</body>
<script>
  const jsPsych = initJsPsych({
    on_finish: function() {
      // Local CSV download for testing
      jsPsych.data.get().localSave('csv', 'cswl_experiment_data.csv');
    }
  });

  let timeline = [];

  // Helper: In-place array shuffle
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  // Prevent consecutive trials from sharing the same mp_id
  function shuffleWithoutConsecutivePairs(trials) {
    let isValid = false;
    let shuffled = [...trials];
    let attempts = 0;
    
    while (!isValid && attempts < 1000) {
      attempts++;
      shuffle(shuffled);
      isValid = true;
      for (let i = 0; i < shuffled.length - 1; i++) {
        if (shuffled[i].mp_id === shuffled[i+1].mp_id) {
          isValid = false;
          break;
        }
      }
    }
    return shuffled;
  }

  // Fetch material info CSV from GitHub Pages root
  Papa.parse('material_info.csv', {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      // Filter rows checking exact header names from material_info.csv
      const materials = results.data.filter(row => row.item_id && row.mp_id);
      
      if (materials.length === 0) {
        console.error("No valid rows parsed from material_info.csv. Check column headers.");
        return;
      }

      runExperiment(materials);
    }
  });

  function runExperiment(materials) {
    // Collect all asset paths for preloading (trimming spaces)
    const audioFiles = materials.map(m => `assets/audio/${m.item_id.trim()}.mp3`);
    const imageFiles = materials.map(m => `assets/stims/${m.item_id.trim()}.png`);

    // 1. Asset Preloader Stage
    timeline.push({
      type: jsPsychPreload,
      audio: audioFiles,
      images: imageFiles,
      message: '<p style="font-size:20px;">Loading experiment assets... Please wait.</p>',
      show_detailed_errors: true,
      auto_preload: false
    });

    // 2. Instructions Page
    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="instructions-card">
          <h2>Cross-Situational Word Learning Task</h2>
          <p>Welcome! In this experiment, you will hear spoken Mandarin words while seeing two pictures on the screen.</p>
          <p><strong>Your Task:</strong> Decide which image corresponds to the audio word you hear.</p>
          <ul>
            <li>Press <strong>F</strong> on your keyboard to select the <strong>LEFT</strong> image.</li>
            <li>Press <strong>J</strong> on your keyboard to select the <strong>RIGHT</strong> image.</li>
          </ul>
          <p>Please respond as quickly and accurately as possible. You will have up to 4.5 seconds per trial.</p>
        </div>
      `,
      choices: ['Continue'],
      button_html: '<button class="btn-continue">%choice%</button>'
    });

    // 3. Generate Learning Blocks (Blocks 1–4)
    const NUM_BLOCKS = 4;
    for (let b = 1; b <= NUM_BLOCKS; b++) {
      let blockTrials = [];

      materials.forEach((targetItem, idx) => {
        // Collect valid non-pair foil candidates using mp_id
        const nonPairCandidates = materials.filter(m => m.mp_id.trim() !== targetItem.mp_id.trim());
        
        // Select deterministic foil index per block to ensure balanced distribution
        const foilIndex = (idx + (b * 3)) % nonPairCandidates.length;
        const foilItem = nonPairCandidates[foilIndex];

        // Randomize image placement (Left/Right)
        const targetOnLeft = Math.random() < 0.5;
        const leftImg = targetOnLeft ? targetItem.item_id.trim() : foilItem.item_id.trim();
        const rightImg = targetOnLeft ? foilItem.item_id.trim() : targetItem.item_id.trim();
        const correctKey = targetOnLeft ? 'f' : 'j';

        blockTrials.push({
          target_id: targetItem.item_id.trim(),
          mp_id: targetItem.mp_id.trim(),
          target_audio: `assets/audio/${targetItem.item_id.trim()}.mp3`,
          left_image: `assets/stims/${leftImg}.png`,
          right_image: `assets/stims/${rightImg}.png`,
          correct_response: correctKey,
          is_target_left: targetOnLeft,
          block_type: 'learning',
          block_num: b
        });
      });

      let orderedTrials = shuffleWithoutConsecutivePairs(blockTrials);
      orderedTrials.forEach(t => addTrialSequence(t));
    }

    // 4. Generate Final Test Block (Block 5: Minimal Pair Foils)
    let testTrials = [];
    materials.forEach(targetItem => {
      // Foil is strictly the minimal pair partner matching mp_id
      const partnerItem = materials.find(m => m.mp_id.trim() === targetItem.mp_id.trim() && m.item_id.trim() !== targetItem.item_id.trim());
      
      const targetOnLeft = Math.random() < 0.5;
      const leftImg = targetOnLeft ? targetItem.item_id.trim() : partnerItem.item_id.trim();
      const rightImg = targetOnLeft ? partnerItem.item_id.trim() : targetItem.item_id.trim();
      const correctKey = targetOnLeft ? 'f' : 'j';

      testTrials.push({
        target_id: targetItem.item_id.trim(),
        mp_id: targetItem.mp_id.trim(),
        target_audio: `assets/audio/${targetItem.item_id.trim()}.mp3`,
        left_image: `assets/stims/${leftImg}.png`,
        right_image: `assets/stims/${rightImg}.png`,
        correct_response: correctKey,
        is_target_left: targetOnLeft,
        block_type: 'test_minimal_pair',
        block_num: 5
      });
    });

    let orderedTestTrials = shuffleWithoutConsecutivePairs(testTrials);
    orderedTestTrials.forEach(t => addTrialSequence(t));

    // End Screen
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `<h2>Thank you!</h2><p>The experiment is complete. Your data file is downloading.</p>`,
      choices: "NO_KEYS",
      trial_duration: 3000
    });

    jsPsych.run(timeline);
  }

  function addTrialSequence(trialData) {
    // 1. Fixation Cross (1000 ms)
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div class="fixation-cross">+</div>',
      choices: "NO_KEYS",
      trial_duration: 1000
    });

    // 2. Inter-Stimulus Interval (250 ms)
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '',
      choices: "NO_KEYS",
      trial_duration: 250
    });

    // 3. Choice Trial (Audio Playback + Visual Choice, Max 4500 ms)
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <audio autoplay src="${trialData.target_audio}"></audio>
        <div class="stim-container">
          <div class="img-wrapper">
            <img src="${trialData.left_image}" class="stim-image">
            <span class="key-hint">[ F ]</span>
          </div>
          <div class="img-wrapper">
            <img src="${trialData.right_image}" class="stim-image">
            <span class="key-hint">[ J ]</span>
          </div>
        </div>
      `,
      choices: ['f', 'j'],
      trial_duration: 4500,
      data: {
        target_id: trialData.target_id,
        mp_id: trialData.mp_id,
        block_num: trialData.block_num,
        block_type: trialData.block_type,
        correct_response: trialData.correct_response,
        left_image: trialData.left_image,
        right_image: trialData.right_image
      },
      on_finish: function(data) {
        data.correct = (data.response === data.correct_response);
      }
    });
  }
</script>
</html>
