<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSWL Experiment</title>
  <!-- jsPsych core and CSS -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  
  <!-- jsPsych Plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  
  <!-- PapaParse for CSV loading -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    .stim-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 700px;
      margin: 50px auto;
    }
    .stim-image {
      width: 220px;
      height: 220px;
      object-fit: contain;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
    .fixation-cross {
      font-size: 60px;
      font-weight: bold;
    }
    .key-hint {
      position: absolute;
      bottom: -30px;
      font-size: 16px;
      color: #555;
    }
    .img-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
</body>
<script>
  const jsPsych = initJsPsych({
    on_finish: function() {
      // Local CSV download for testing before DataPipe integration
      jsPsych.data.get().localSave('csv', 'cswl_experiment_data.csv');
    }
  });

  let timeline = [];

  // Helper: In-place array shuffle
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  // Prevent consecutive trials from sharing the same pair_id
  function shuffleWithoutConsecutivePairs(trials) {
    let isValid = false;
    let shuffled = [...trials];
    let attempts = 0;
    
    while (!isValid && attempts < 1000) {
      attempts++;
      shuffle(shuffled);
      isValid = true;
      for (let i = 0; i < shuffled.length - 1; i++) {
        if (shuffled[i].pair_id === shuffled[i+1].pair_id) {
          isValid = false;
          break;
        }
      }
    }
    return shuffled;
  }

  // Load CSV from server (GitHub Pages root)
  Papa.parse('material_info.csv', {
    download: true,
    header: true,
    complete: function(results) {
      const materials = results.data.filter(row => row.item_id && row.pair_id);
      runExperiment(materials);
    }
  });

  function runExperiment(materials) {
    // 1. Preload Audio and Image Assets
    const audioFiles = materials.map(m => `assets/audio/${m.item_id}.mp3`);
    const imageFiles = materials.map(m => `assets/stims/${m.item_id}.png`);

    timeline.push({
      type: jsPsychPreload,
      audio: audioFiles,
      images: imageFiles
    });

    // Welcome & Instructions
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <h2>Word Learning Task</h2>
        <p>In each trial, you will hear a word and see two pictures.</p>
        <p>Press <strong>F</strong> for the picture on the <strong>LEFT</strong>.</p>
        <p>Press <strong>J</strong> for the picture on the <strong>RIGHT</strong>.</p>
        <br>
        <p>Press spacebar to begin.</p>
      `,
      choices: [' ']
    });

    // 2. Generate Learning Blocks (Blocks 1–4)
    const NUM_BLOCKS = 4;
    
    // Group materials by pair_id to easily locate non-pair items
    const pairMap = {};
    materials.forEach(m => {
      if (!pairMap[m.pair_id]) pairMap[m.pair_id] = [];
      pairMap[m.pair_id].push(m);
    });

    for (let b = 1; b <= NUM_BLOCKS; b++) {
      let blockTrials = [];

      // Create a deterministic foil assignment shift per block to guarantee equal usage
      materials.forEach((targetItem, idx) => {
        // Collect all non-pair candidates
        const nonPairCandidates = materials.filter(m => m.pair_id !== targetItem.pair_id);
        
        // Select a foil index unique to this block and item
        const foilIndex = (idx + (b * 3)) % nonPairCandidates.length;
        const foilItem = nonPairCandidates[foilIndex];

        // Randomize image placement (Left/Right)
        const targetOnLeft = Math.random() < 0.5;
        const leftImg = targetOnLeft ? targetItem.item_id : foilItem.item_id;
        const rightImg = targetOnLeft ? foilItem.item_id : targetItem.item_id;
        const correctKey = targetOnLeft ? 'f' : 'j';

        blockTrials.push({
          target_id: targetItem.item_id,
          pair_id: targetItem.pair_id,
          target_audio: `assets/audio/${targetItem.item_id}.mp3`,
          left_image: `assets/stims/${leftImg}.png`,
          right_image: `assets/stims/${rightImg}.png`,
          correct_response: correctKey,
          is_target_left: targetOnLeft,
          block_type: 'learning',
          block_num: b
        });
      });

      let orderedTrials = shuffleWithoutConsecutivePairs(blockTrials);
      orderedTrials.forEach(t => addTrialSequence(t));
    }

    // 3. Final Test Block (Block 5: Minimal Pair Foils)
    let testTrials = [];
    materials.forEach(targetItem => {
      // Foil is strictly the minimal pair partner
      const partnerItem = materials.find(m => m.pair_id === targetItem.pair_id && m.item_id !== targetItem.item_id);
      
      const targetOnLeft = Math.random() < 0.5;
      const leftImg = targetOnLeft ? targetItem.item_id : partnerItem.item_id;
      const rightImg = targetOnLeft ? partnerItem.item_id : targetItem.item_id;
      const correctKey = targetOnLeft ? 'f' : 'j';

      testTrials.push({
        target_id: targetItem.item_id,
        pair_id: targetItem.pair_id,
        target_audio: `assets/audio/${targetItem.item_id}.mp3`,
        left_image: `assets/stims/${leftImg}.png`,
        right_image: `assets/stims/${rightImg}.png`,
        correct_response: correctKey,
        is_target_left: targetOnLeft,
        block_type: 'test_minimal_pair',
        block_num: 5
      });
    });

    let orderedTestTrials = shuffleWithoutConsecutivePairs(testTrials);
    orderedTestTrials.forEach(t => addTrialSequence(t));

    // End Message
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `<h2>Thank you!</h2><p>The experiment is complete. Your data file is downloading.</p>`,
      choices: "NO_KEYS",
      trial_duration: 3000
    });

    jsPsych.run(timeline);
  }

  function addTrialSequence(trialData) {
    // 1. Fixation Cross (1000 ms)
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div class="fixation-cross">+</div>',
      choices: "NO_KEYS",
      trial_duration: 1000
    });

    // 2. Inter-Stimulus Interval (250 ms)
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '',
      choices: "NO_KEYS",
      trial_duration: 250
    });

    // 3. Choice Trial (Audio Playback + Visual Choice, Max 4500 ms)
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <audio autoplay src="${trialData.target_audio}"></audio>
        <div class="stim-container">
          <div class="img-wrapper">
            <img src="${trialData.left_image}" class="stim-image">
            <span class="key-hint">[ F ]</span>
          </div>
          <div class="img-wrapper">
            <img src="${trialData.right_image}" class="stim-image">
            <span class="key-hint">[ J ]</span>
          </div>
        </div>
      `,
      choices: ['f', 'j'],
      trial_duration: 4500,
      data: {
        target_id: trialData.target_id,
        pair_id: trialData.pair_id,
        block_num: trialData.block_num,
        block_type: trialData.block_type,
        correct_response: trialData.correct_response,
        left_image: trialData.left_image,
        right_image: trialData.right_image
      },
      on_finish: function(data) {
        data.correct = (data.response === data.correct_response);
      }
    });
  }
</script>
</html>
